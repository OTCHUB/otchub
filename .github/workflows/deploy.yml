name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite loads .env.production.local automatically for `vite build`.
      # This file is gitignored (*.local), so CI writes it from repo secrets
      # right before building — mirrors the local production-build setup.
      #
      # Program IDs are stored as Solscan/Solana.fm explorer URLs (with a
      # `?ref=...&cluster=...` query string), not raw pubkeys — strip the
      # query string here so the app gets a plain base58 address.
      - name: Write production env
        run: |
          MAINNET_PROGRAM_ID="${{ secrets.VITE_HUB_MAINNET_PROGRAM_ID }}"
          MAINNET_PROGRAM_ID="${MAINNET_PROGRAM_ID%%\?*}"
          DEVNET_PROGRAM_ID="${{ secrets.VITE_HUB_DEVNET_PROGRAM_ID }}"
          DEVNET_PROGRAM_ID="${DEVNET_PROGRAM_ID%%\?*}"
          cat <<EOF > .env.production.local
          # Main mount (/hub) — mainnet-beta config.
          # $HUB program is live + OtterSec-verified on mainnet-beta at the same
          # address as devnet (7c5oPs9G...7b7i) — see src/hub/lib/deployments.ts.
          # All 6 initialize_* mainnet transactions have run and Config.hubMint
          # matches VITE_HUB_MINT below, so /hub is now enabled for production.
          VITE_HUB_RPC_URL=${{ secrets.VITE_HUB_MAINNET_RPC_URL }}
          VITE_HUB_CLUSTER=${{ secrets.VITE_HUB_MAINNET_CLUSTER }}
          VITE_HUB_PROGRAM_ID=$MAINNET_PROGRAM_ID

          # Sandbox mount (/devnet) — QA only, always devnet.
          VITE_HUB_DEVNET_RPC_URL=${{ secrets.VITE_HUB_DEVNET_RPC_URL }}
          VITE_HUB_DEVNET_PROGRAM_ID=$DEVNET_PROGRAM_ID

          # Launch control — flip to true only once the real mainnet program
          # (and VITE_HUB_MINT below) are live. Requires a PR to change.
          VITE_HUB_ENABLED=true

          # $HUB token mint — set once minted via the OTC launcher.
          # Empty keeps every mint-gated UI element hidden (see src/lib/hubMint.js).
          VITE_HUB_MINT=5yrUrzyDBs5NrZdiGtW1BEYUjHyHBLx1L5vTAKUxvo1V

          VITE_BASE44_APP_ID=${{ secrets.VITE_BASE44_APP_ID }}

          # Base44 backend — required when deployed outside Base44's own hosting.
          # On Base44 preview the platform reverse-proxies /api/* for you; on
          # Cloudflare Pages there is no proxy, so the SDK must call Base44 directly.
          VITE_BASE44_APP_BASE_URL=https://base44.app

          # Solana RPC relay Worker — routes blockhash/simulate/send through
          # Helius server-side so the browser never hits the public RPC directly.
          # Set this secret after deploying workers/solana-relay via wrangler.
          VITE_SOLANA_RELAY_URL=${{ secrets.VITE_SOLANA_RELAY_URL }}
          EOF

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=otchub
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
