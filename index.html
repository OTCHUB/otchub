<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a97c0a4fb3601dc274f8d83/7166bbd89_hub_mt.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>OTC_HUB :: OTC DESKS ANALYTICS</title>
    <meta name="description" content="Live community analytics for the OTC Desks protocol (otcdesks.cash) on Solana: $OTC price & market data, OTC Desk NFT floor and mint-vs-secondary arbitrage, desk pot revenue by source (mint surcharge, Magic Eden royalties, launchpad fees), distribution rounds, buybacks, and a wallet portfolio tool with on-chain stock claim scanning. Not affiliated with the protocol." />
    <meta name="keywords" content="OTC Desks, otcdesks.cash, OTC token, $OTC, Solana NFT analytics, desk NFT arbitrage, Solana on-chain claims, Magic Eden royalties, desk pot revenue, Solana analytics dashboard" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://otchub.dev/" />

    <!-- MODERN skin fonts (Iridescent Terminal): Inter Tight = UI,
         IBM Plex Mono = data, Press Start 2P = HUD display moments.
         Only the html.skin-modern token block consumes them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OTC Hub" />
    <meta property="og:title" content="OTC_HUB :: OTC DESKS ANALYTICS" />
    <meta property="og:description" content="Live $OTC price, desk NFT mint-vs-secondary arbitrage, desk pot revenue by source, distribution rounds and on-chain wallet stock claims — community analytics for the OTC Desks protocol on Solana. Not affiliated with otcdesks.cash." />
    <meta property="og:url" content="https://otchub.dev/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OTC_HUB :: OTC DESKS ANALYTICS" />
    <meta name="twitter:description" content="Live $OTC price, desk NFT arbitrage, desk pot revenue and on-chain wallet stock claims for the OTC Desks protocol on Solana. Community tooling — not affiliated with otcdesks.cash." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OTC Hub",
        "url": "https://otchub.dev/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Real-time analytics dashboard for the OTC Desks protocol on Solana: $OTC token market data, desk NFT arbitrage, desk pot revenue attribution, distribution rounds, and wallet portfolio tracking with on-chain stock claims.",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true
      }
    </script>
    <!-- Apply the stored theme before CSS/JS loads so light users get no dark flash -->
    <script>
      try {
        if (localStorage.getItem("otc_theme") === "light") document.documentElement.classList.add("light");
        if (localStorage.getItem("otc_skin") === "modern") document.documentElement.classList.add("skin-modern");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
